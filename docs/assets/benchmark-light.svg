<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 732" width="800" height="732" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Obsidian Bridge MCP request times on a synthetic vault of 20,000 generated notes</title>
  <desc id="d">Median milliseconds. One page of results: list 100 notes 0.84, list 500 notes 0.93, search paths 200 matches 0.82, search content 20 matches 0.81, search content 200 matches 1.10. Deeper or sparser pages: list 100 notes from the middle 11, backlinks 50 matches 14, search content matches 10,000 to 10,200 16. Reading the whole vault: newest 500 notes with dates 40, count every tag 167, all 200 matches of a rare phrase 391, search with no match 392, list all 20,000 notes in 40 pages 433, all 1,000 backlinks in 5 pages 1,056.</desc>
  <rect width="800" height="732" rx="12" fill="#fcfcfb"/>
  <rect x="0.5" y="0.5" width="799" height="731" rx="11.5" fill="none" stroke="#e4e3df"/>

  <text x="24" y="38" font-size="20" font-weight="600" fill="#0b0b0b">Synthetic benchmark: 20,000 generated notes, 631,200 lines</text>
  <text x="24" y="60" font-size="13" fill="#52514e">Median time in milliseconds. Shorter is faster.</text>

  <text x="24" y="98" font-size="14" font-weight="600" fill="#0b0b0b">One page of results: about 1 ms at any page size</text>
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="290.5" y1="108" x2="290.5" y2="262"/>
    <line x1="495.5" y1="108" x2="495.5" y2="262"/>
    <line x1="700.5" y1="108" x2="700.5" y2="262"/>
  </g>
  <g font-size="13" fill="#52514e">
    <text x="24" y="127">List 100 notes</text>
    <text x="24" y="157">List 500 notes (largest page)</text>
    <text x="24" y="187">Search paths, 200 matches</text>
    <text x="24" y="217">Search content, 20 matches</text>
    <text x="24" y="247">Search content, 200 matches</text>
  </g>
  <g fill="#2a78d6">
    <path d="M290 114h168a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-168z"/>
    <path d="M290 144h187a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-187z"/>
    <path d="M290 174h164a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-164z"/>
    <path d="M290 204h162a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-162z"/>
    <path d="M290 234h222a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-222z"/>
  </g>
  <g font-size="13" font-weight="600" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round" paint-order="stroke">
    <text x="470" y="127">0.84 ms</text>
    <text x="489" y="157">0.93 ms</text>
    <text x="466" y="187">0.82 ms</text>
    <text x="464" y="217">0.81 ms</text>
    <text x="524" y="247">1.10 ms</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="290" y="280">0</text>
    <text x="495" y="280">1 ms</text>
    <text x="700" y="280">2 ms</text>
  </g>

  <text x="24" y="320" font-size="14" font-weight="600" fill="#0b0b0b">Deeper or sparser pages: more notes are read to fill them</text>
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="290.5" y1="330" x2="290.5" y2="424"/>
    <line x1="495.5" y1="330" x2="495.5" y2="424"/>
    <line x1="700.5" y1="330" x2="700.5" y2="424"/>
  </g>
  <g font-size="13" fill="#52514e">
    <text x="24" y="349">List 100 notes from the middle</text>
    <text x="24" y="379">Backlinks, 50 matches in 1,000 notes</text>
    <text x="24" y="409">Search content, matches 10,000 to 10,200</text>
  </g>
  <g fill="#2a78d6">
    <path d="M290 336h224a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-224z"/>
    <path d="M290 366h277a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-277z"/>
    <path d="M290 396h322a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-322z"/>
  </g>
  <g font-size="13" font-weight="600" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round" paint-order="stroke">
    <text x="526" y="349">11 ms</text>
    <text x="579" y="379">14 ms</text>
    <text x="624" y="409">16 ms</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="290" y="442">0</text>
    <text x="495" y="442">10 ms</text>
    <text x="700" y="442">20 ms</text>
  </g>

  <text x="24" y="482" font-size="14" font-weight="600" fill="#0b0b0b">Reading the whole vault</text>
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="290.5" y1="492" x2="290.5" y2="676"/>
    <line x1="495.5" y1="492" x2="495.5" y2="676"/>
    <line x1="700.5" y1="492" x2="700.5" y2="676"/>
  </g>
  <g font-size="13" fill="#52514e">
    <text x="24" y="511">Newest 500 notes with dates</text>
    <text x="24" y="541">Count every tag</text>
    <text x="24" y="571">All 200 matches of a rare phrase</text>
    <text x="24" y="601">Search content, none found</text>
    <text x="24" y="631">List all 20,000 notes (40 pages)</text>
    <text x="24" y="661">All 1,000 backlinks (5 pages)</text>
  </g>
  <g fill="#2a78d6">
    <path d="M290 498h10a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-10z"/>
    <path d="M290 528h53a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-53z"/>
    <path d="M290 558h130a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-130z"/>
    <path d="M290 588h130a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-130z"/>
    <path d="M290 618h144a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-144z"/>
    <path d="M290 648h357a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-357z"/>
  </g>
  <g font-size="13" font-weight="600" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round" paint-order="stroke">
    <text x="312" y="511">40 ms</text>
    <text x="355" y="541">167 ms</text>
    <text x="432" y="571">391 ms</text>
    <text x="432" y="601">392 ms</text>
    <text x="446" y="631">433 ms</text>
    <text x="659" y="661">1,056 ms</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="290" y="694">0</text>
    <text x="495" y="694">600 ms</text>
    <text x="700" y="694">1,200 ms</text>
  </g>

  <text x="24" y="718" font-size="11" fill="#52514e">Apple M3 Pro. Notes generated by the benchmark, warm filesystem cache, median of 9 runs. Each panel has its own scale.</text>
</svg>
