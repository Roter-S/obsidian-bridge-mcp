    <text x="499" y="493">7.9 ms</text>
    <text x="633" y="529">149 ms, finds nothing</text>
    <text x="463" y="565">3.6 ms</text>
    <text x="536" y="601">18 ms</text>
    <text x="655" y="637">242 ms, misses 7 tags</text>
    <g text-anchor="end">
      <text x="558" y="673">44 ms</text>
    </g>
    <text x="394" y="467">0.80 ms</text>
    <text x="397" y="503">0.85 ms</text>
    <g text-anchor="end">
      <text x="540" y="539">30 ms</text>
    </g>
    <text x="304" y="575">0.11 ms</text>
    <g text-anchor="end">
      <text x="505" y="611">14 ms</text>
      <text x="619" y="647">167 ms</text>
    </g>
    <text x="604" y="683">79 ms</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="290" y="728">0.1 ms</text>
    <text x="395" y="728">1 ms</text>
    <text x="500" y="728">10 ms</text>
    <text x="605" y="728">100 ms</text>
    <text x="710" y="728">1 second</text>
  </g>

  <text x="24" y="756" font-size="11" fill="#52514e">Both scales are logarithmic: each step is ten times the one before. Tokens are estimated as bytes ÷ 4. The long note is read with cat and sed.</text>
  <text x="24" y="772" font-size="11" fill="#52514e">Apple M3 Pro, ripgrep 15.2, warm filesystem cache, median of 5 runs. Server calls are timed in-process.</text>
</svg>
